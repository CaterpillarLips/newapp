{% extends "base.html" %}

{% block title %}Albums{% endblock %}

{% block content %}
    <h1>Albums</h1>

    <ul>
        {% if albums %}
            {% for album in albums %}
                <li>{{ album }}</li>
            {% endfor %}
        {% else %}
            <p>No books in stock yet.</p>
        {% endif %}
    </ul>

    <form action="{{ url_for('search') }}" method="GET">
        <input
            type="text"
            name="q"
            placeholder="Search here..."
            value="{{ request.args.get('q', '') }}"
        >

        <button type="submit">Search</button>
    </form>
{% endblock %}
