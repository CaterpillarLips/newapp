<h1>Album Search</h1>

<form action="{{ url_for('search') }}" method="GET">
    <input
        type="text"
        name="q"
        placeholder="Search here..."
        value="{{ query }}"
    >

    <button type="submit">Search</button>
</form>

<ul>
    {% if albums %}
        {% for album in albums %}
            <li>{{ album }}</li>
        {% endfor %}
    {% else %}
        <p>No albums found.</p>
    {% endif %}
</ul>
